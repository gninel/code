version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    environment:
      - MP_DEBUG=false
      - MP_DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/musicpocket
      - MP_REDIS_URL=redis://redis:6379/0
      - MP_JWT_SECRET=${JWT_SECRET}
      - MP_S3_ENDPOINT=${S3_ENDPOINT}
      - MP_S3_BUCKET=${S3_BUCKET}
      - MP_S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - MP_S3_SECRET_KEY=${S3_SECRET_KEY}
    depends_on:
      - db
      - redis
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  celery-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: celery -A app.services.celery_worker worker --loglevel=info --concurrency=4
    restart: always
    environment:
      - MP_REDIS_URL=redis://redis:6379/0
      - MP_DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/musicpocket
    depends_on:
      - redis
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  celery-beat:
    build:
      context: ..
      dockerfile: Dockerfile
    command: celery -A app.services.celery_worker beat --loglevel=info
    restart: always
    environment:
      - MP_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    deploy:
      replicas: 1

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: musicpocket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/ssl:ro
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
