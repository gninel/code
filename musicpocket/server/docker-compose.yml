version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MP_DEBUG=true
      - MP_DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/musicpocket
      - MP_REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: musicpocket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
