name: music_pocket
description: 将视频链接转换为离线音频

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # 状态管理
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # 网络
  dio: ^5.3.2
  json_annotation: ^4.8.1

  # 本地存储
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # 音频播放
  just_audio: ^0.9.36
  audio_session: ^0.1.16
  just_audio_background: ^0.0.1-beta.11

  # 文件和权限
  path: ^1.8.3
  permission_handler: ^11.0.1

  # 剪贴板监听
  clipboard_watcher: ^0.2.1

  # 工具
  uuid: ^4.2.1
  intl: ^0.20.2
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
